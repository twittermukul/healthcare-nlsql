<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Analytics NL→SQL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            margin-bottom: 20px;
            height: calc(100vh - 200px);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px 12px 0 0;
            scroll-behavior: smooth;
        }

        .chat-message {
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-user {
            display: flex;
            justify-content: flex-end;
        }

        .message-assistant {
            display: flex;
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
        }

        .message-user .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-assistant .message-bubble {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .message-label {
            font-size: 0.75em;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .message-user .message-label {
            text-align: right;
        }

        .assistant-result {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .sql-code {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin: 8px 0;
            overflow-x: auto;
        }

        .insights-box {
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            border-left: 4px solid #667eea;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .suggestion-chip {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            margin: 6px 6px 6px 0;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .suggestion-chip:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .chat-input-area {
            background: white;
            padding: 20px;
            border-radius: 0 0 12px 12px;
            border-top: 1px solid #e1e4e8;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .example-queries {
            max-height: 600px;
            overflow-y: auto;
        }

        .example-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .example-item:hover {
            background: #e9ecef;
            border-left-color: #667eea;
            transform: translateX(5px);
        }

        .example-item .question {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .example-item .description {
            font-size: 0.9em;
            color: #666;
        }

        .query-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        #questionInput {
            flex: 1;
            padding: 15px;
            border: 2px solid #e1e4e8;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.2s;
        }

        #questionInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .sql-display {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            overflow-x: auto;
        }

        .sql-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .copy-btn {
            padding: 5px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        .explanation {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #2196f3;
        }

        .table-container {
            overflow-x: auto;
            max-height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e1e4e8;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #667eea;
            color: white;
            border-radius: 4px;
            font-size: 0.8em;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 Healthcare Analytics</h1>
            <p>Ask questions in natural language, get SQL queries and results instantly</p>
        </div>

        <div class="main-content">
            <!-- Example Queries Sidebar -->
            <div class="card">
                <h2>📚 Example Questions</h2>
                <div class="example-queries" id="exampleQueries">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading examples...</p>
                    </div>
                </div>
            </div>

            <!-- Chat Interface -->
            <div class="card chat-container">
                <!-- Chat History -->
                <div class="chat-history" id="chatHistory">
                    <div style="text-align: center; color: #999; padding: 40px 20px;">
                        <div style="font-size: 48px; margin-bottom: 10px;">💬</div>
                        <div style="font-size: 1.1em; font-weight: 600; margin-bottom: 8px;">Start a Conversation</div>
                        <div style="font-size: 0.9em;">Ask a question about healthcare data or enable conversation mode for intelligent insights</div>
                    </div>
                </div>

                <!-- Chat Input Area -->
                <div class="chat-input-area">
                    <!-- Conversation Mode Toggle -->
                    <div style="margin-bottom: 15px; display: flex; align-items: center; gap: 15px; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                        <label style="display: flex; align-items: center; cursor: pointer; gap: 8px;">
                            <input type="checkbox" id="conversationMode" onchange="toggleConversationMode()" style="width: 18px; height: 18px; cursor: pointer;">
                            <span style="font-weight: 600; color: #333;">🤖 Conversation Mode</span>
                        </label>
                        <select id="modelSelect" style="padding: 8px 12px; border: 2px solid #e1e4e8; border-radius: 6px; font-size: 0.9em; background: white; cursor: pointer;">
                            <optgroup label="GPT-4">
                                <option value="gpt-4o" selected>GPT-4o</option>
                                <option value="gpt-4o-mini">GPT-4o Mini</option>
                            </optgroup>
                            <optgroup label="GPT-5">
                                <option value="gpt-5">GPT-5</option>
                                <option value="gpt-5-mini">GPT-5 Mini</option>
                            </optgroup>
                        </select>
                        <button id="clearConversationBtn" onclick="clearConversation()" style="margin-left: auto; padding: 6px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9em; display: none;">
                            🗑️ Clear
                        </button>
                    </div>

                    <!-- Input -->
                    <div class="input-group">
                        <input
                            type="text"
                            id="questionInput"
                            placeholder="Ask about healthcare data..."
                            onkeypress="handleKeyPress(event)"
                            style="flex: 1; padding: 15px; border: 2px solid #e1e4e8; border-radius: 8px; font-size: 1em;"
                        >
                        <button class="btn btn-primary" onclick="executeQuery()" id="executeBtn">
                            Send
                        </button>
                    </div>
                </div>
            </div>

            <!-- Hidden Results Section for compatibility -->
            <div class="results-section" id="resultsSection" style="display: none;">
                    <h2>📊 Results</h2>

                    <div id="explanationDiv" style="display: none;" class="explanation">
                        <strong>Explanation:</strong>
                        <p id="explanationText"></p>
                    </div>

                    <div class="sql-header">
                        <strong>Generated SQL:</strong>
                        <div>
                            <button class="copy-btn" onclick="copySql()" style="margin-right: 5px;">Copy SQL</button>
                            <button class="copy-btn" id="editSqlBtn" onclick="toggleEditSql()" style="display: none;">✏️ Edit Query</button>
                            <button class="copy-btn" id="executeSqlBtn" onclick="executeEditedSql()" style="display: none; background: #28a745;">▶ Execute Edited</button>
                            <button class="copy-btn" id="cancelEditBtn" onclick="cancelEditSql()" style="display: none; background: #dc3545;">Cancel</button>
                        </div>
                    </div>
                    <div class="sql-display" id="sqlDisplay"></div>
                    <textarea class="sql-display" id="sqlEditor" style="display: none; font-family: 'Courier New', monospace; resize: vertical; min-height: 150px;"></textarea>

                    <div id="errorDiv" style="display: none;" class="error"></div>

                    <div id="tableContainer" class="table-container"></div>

                    <div id="paginationContainer" style="display: none; margin: 20px 0; text-align: center;">
                        <button id="prevPage" onclick="changePage(-1)" style="padding: 8px 16px; margin: 0 5px; cursor: pointer; border: 1px solid #ddd; background: white; border-radius: 4px;">← Previous</button>
                        <span id="pageInfo" style="margin: 0 15px; font-weight: 500;"></span>
                        <button id="nextPage" onclick="changePage(1)" style="padding: 8px 16px; margin: 0 5px; cursor: pointer; border: 1px solid #ddd; background: white; border-radius: 4px;">Next →</button>
                    </div>

                    <div class="stats" id="statsDiv"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';

        // Load example queries on page load
        async function loadExamples() {
            console.log('Loading examples...');
            try {
                const response = await fetch(`${API_BASE}/api/examples`);
                console.log('Response status:', response.status);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const examples = await response.json();
                console.log('Loaded examples:', examples.length);

                const container = document.getElementById('exampleQueries');
                if (!container) {
                    console.error('Container #exampleQueries not found!');
                    return;
                }

                container.innerHTML = examples.map((ex, index) => `
                    <div class="example-item" data-question-id="${index}">
                        <div class="question">${ex.question}</div>
                        <div class="description">${ex.description}</div>
                        <span class="category-badge">${ex.category}</span>
                    </div>
                `).join('');

                // Add click handlers
                examples.forEach((ex, index) => {
                    const element = container.querySelector(`[data-question-id="${index}"]`);
                    if (element) {
                        element.addEventListener('click', () => setQuestion(ex.question));
                    }
                });

                console.log('Examples loaded successfully');
            } catch (error) {
                console.error('Failed to load examples:', error);
                const container = document.getElementById('exampleQueries');
                if (container) {
                    container.innerHTML = `<p style="color: #c33; padding: 15px;">Failed to load examples: ${error.message}</p>`;
                }
            }
        }

        function setQuestion(question) {
            document.getElementById('questionInput').value = question;
            document.getElementById('questionInput').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                executeQuery();
            }
        }

        let skipSpellCheck = false;

        // Chat message management
        function addUserMessage(question) {
            const chatHistory = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message message-user';
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="message-label">You</div>
                    <div>${question}</div>
                </div>
            `;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function addAssistantMessage(data) {
            console.log('🎨 Rendering assistant message:', {
                hasConversation: !!data.conversation,
                hasInsights: !!data.conversation?.insights,
                hasSuggestions: !!data.conversation?.suggestions?.length,
                conversationData: data.conversation
            });

            const chatHistory = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message message-assistant';

            let resultHTML = '';

            // SQL Code
            if (data.sql) {
                resultHTML += `<div class="sql-code">${data.sql}</div>`;
            }

            // Results table
            if (data.rows && data.rows.length > 0) {
                const tableHTML = `
                    <table style="width: 100%; border-collapse: collapse; margin: 12px 0;">
                        <thead>
                            <tr>${data.columns.map(col => `<th style="background: #667eea; color: white; padding: 8px; text-align: left;">${col}</th>`).join('')}</tr>
                        </thead>
                        <tbody>
                            ${data.rows.slice(0, 5).map(row => `
                                <tr>${data.columns.map(col => `<td style="padding: 8px; border-bottom: 1px solid #e1e4e8;">${formatValue(row[col])}</td>`).join('')}</tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                resultHTML += tableHTML;

                if (data.rows.length > 5) {
                    resultHTML += `<div style="font-size: 0.9em; color: #666; margin-top: 8px;">Showing first 5 of ${data.rows.length} rows</div>`;
                }
            } else if (data.success) {
                resultHTML += `<div style="padding: 20px; text-align: center; color: #666;">✓ Query executed successfully (0 results)</div>`;
            }

            // Insights and suggestions
            if (data.conversation) {
                if (data.conversation.insights) {
                    resultHTML += `
                        <div class="insights-box">
                            <div style="font-weight: 600; margin-bottom: 8px;">💡 Insights</div>
                            <div>${data.conversation.insights}</div>
                        </div>
                    `;
                }

                if (data.conversation.suggestions && data.conversation.suggestions.length > 0) {
                    resultHTML += `<div style="margin-top: 12px; font-weight: 600;">🔍 Try these next:</div>`;
                    data.conversation.suggestions.forEach(s => {
                        resultHTML += `
                            <div class="suggestion-chip" onclick="executeSuggestion('${s.question.replace(/'/g, "\\'")}')">${s.question}</div>
                        `;
                    });
                }

                if (data.conversation.nudge) {
                    resultHTML += `<div style="margin-top: 12px; font-style: italic; color: #667eea;">💭 ${data.conversation.nudge}</div>`;
                }
            }

            // Stats
            if (data.execution_time_ms) {
                resultHTML += `<div style="font-size: 0.85em; color: #999; margin-top: 12px;">${data.model} • ${data.execution_time_ms}ms</div>`;
            }

            messageDiv.innerHTML = `
                <div class="message-bubble" style="max-width: 90%;">
                    <div class="message-label">Assistant</div>
                    <div class="assistant-result">${resultHTML}</div>
                </div>
            `;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function addLoadingMessage() {
            const chatHistory = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message message-assistant';
            messageDiv.id = 'loadingMessage';
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="message-label">Assistant</div>
                    <div class="loading"><div class="spinner"></div><p>Thinking...</p></div>
                </div>
            `;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function removeLoadingMessage() {
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) loadingMsg.remove();
        }

        async function executeQuery(forceExecute = false) {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) {
                alert('Please enter a question');
                return;
            }

            const executeBtn = document.getElementById('executeBtn');

            // Show loading
            executeBtn.disabled = true;
            executeBtn.textContent = 'Sending...';

            // Add user message to chat
            addUserMessage(question);

            // Clear input
            document.getElementById('questionInput').value = '';

            // Add loading message
            addLoadingMessage();

            try {
                const model = document.getElementById('modelSelect').value;

                // Use conversation endpoint if conversation mode is enabled
                const endpoint = conversationModeEnabled ? '/api/conversation/query' : '/api/query';

                const requestBody = {
                    question: question,
                    include_explanation: true,
                    model: model,
                    skip_spell_check: forceExecute || skipSpellCheck
                };

                // Add session_id for conversation mode
                if (conversationModeEnabled && currentSessionId) {
                    requestBody.session_id = currentSessionId;
                }

                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                // Remove loading message
                removeLoadingMessage();

                // Debug logging
                console.log('📥 Response received:', {
                    success: data.success,
                    hasConversation: !!data.conversation,
                    conversationMode: conversationModeEnabled,
                    insights: data.conversation?.insights?.substring(0, 50),
                    suggestionsCount: data.conversation?.suggestions?.length,
                    needsConfirmation: data.needs_confirmation,
                    needsClarification: data.needs_clarification
                });

                // Handle spell check suggestions
                if (data.needs_confirmation && data.spell_check) {
                    const chatHistory = document.getElementById('chatHistory');
                    const correctedQuery = data.spell_check.corrected_query;
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'chat-message message-assistant';
                    messageDiv.innerHTML = `
                        <div class="message-bubble" style="max-width: 90%;">
                            <div class="message-label">Assistant</div>
                            <div style="background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; border-radius: 8px;">
                                <div style="font-weight: 600; margin-bottom: 10px;">⚠️ Possible spelling errors detected</div>
                                <div style="margin-bottom: 10px;">
                                    <strong>Original:</strong> <span style="color: #c33;">${question}</span><br>
                                    <strong>Did you mean:</strong> <span style="color: #0a0; font-weight: bold;">${correctedQuery}</span>
                                </div>
                                <div style="display: flex; gap: 10px; margin-top: 15px;">
                                    <div class="suggestion-chip" style="background: #28a745;" onclick="executeSuggestion('${correctedQuery.replace(/'/g, "\\'")}')"
                                         >✓ Use Corrected Version</div>
                                    <div class="suggestion-chip" style="background: #667eea;" onclick="executeQuery(true)">Use Original Anyway</div>
                                </div>
                            </div>
                        </div>
                    `;
                    chatHistory.appendChild(messageDiv);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                    executeBtn.disabled = false;
                    executeBtn.textContent = 'Send';
                    return;
                }

                // Handle ambiguity clarification
                if (data.needs_clarification && data.ambiguity) {
                    const chatHistory = document.getElementById('chatHistory');
                    const ambiguity = data.ambiguity;
                    const options = ambiguity.clarification_options || [];

                    let optionsHtml = '';
                    options.forEach((option, index) => {
                        optionsHtml += `
                            <div class="suggestion-chip" onclick="executeSuggestion('${option.refined_query.replace(/'/g, "\\'")}')"
                                 style="display: block; margin-bottom: 8px; text-align: left;">
                                ${option.text}
                            </div>
                        `;
                    });

                    const customInputId = `customInput_${Date.now()}`;
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'chat-message message-assistant';
                    messageDiv.innerHTML = `
                        <div class="message-bubble" style="max-width: 90%;">
                            <div class="message-label">Assistant</div>
                            <div style="background: #e3f2fd; border-left: 4px solid #2196f3; padding: 15px; border-radius: 8px;">
                                <div style="font-weight: 600; margin-bottom: 10px;">🤔 Your query needs clarification</div>
                                <div style="margin-bottom: 15px;">${ambiguity.reason}</div>
                                <div style="font-weight: 600; margin-bottom: 10px;">What did you mean?</div>
                                ${optionsHtml}
                                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
                                    <input type="text" id="${customInputId}" placeholder="Or type your own clarification..."
                                           style="width: 100%; padding: 10px; border: 2px solid #e1e4e8; border-radius: 6px; margin-bottom: 10px;"
                                           onkeypress="if(event.key==='Enter') executeCustomClarification('${customInputId}')">
                                    <div class="suggestion-chip" onclick="executeCustomClarification('${customInputId}')"
                                         style="background: #667eea; display: inline-block;">
                                        ✏️ Use Custom Query
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    chatHistory.appendChild(messageDiv);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                    executeBtn.disabled = false;
                    executeBtn.textContent = 'Send';
                    return;
                }

                // Add assistant response to chat
                if (data.success) {
                    addAssistantMessage(data);
                } else {
                    // Add error message
                    const chatHistory = document.getElementById('chatHistory');
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'chat-message message-assistant';
                    messageDiv.innerHTML = `
                        <div class="message-bubble">
                            <div class="message-label">Assistant</div>
                            <div class="error">❌ ${data.error || 'Query failed'}</div>
                        </div>
                    `;
                    chatHistory.appendChild(messageDiv);
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }
            } catch (error) {
                removeLoadingMessage();
                const chatHistory = document.getElementById('chatHistory');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'chat-message message-assistant';
                messageDiv.innerHTML = `
                    <div class="message-bubble">
                        <div class="message-label">Assistant</div>
                        <div class="error">❌ Network error: ${error.message}</div>
                    </div>
                `;
                chatHistory.appendChild(messageDiv);
                chatHistory.scrollTop = chatHistory.scrollHeight;
            } finally {
                executeBtn.disabled = false;
                executeBtn.textContent = 'Send';
            }
        }

        // Pagination state
        let currentPage = 1;
        let rowsPerPage = 10;
        let allRows = [];
        let allColumns = [];

        function formatValue(value) {
            if (value === null || value === undefined) {
                return '<span style="color: #999;">NULL</span>';
            }
            if (typeof value === 'number') {
                return value.toLocaleString();
            }
            return value;
        }

        function renderTable(page = 1) {
            const tableContainer = document.getElementById('tableContainer');
            const paginationContainer = document.getElementById('paginationContainer');
            const prevBtn = document.getElementById('prevPage');
            const nextBtn = document.getElementById('nextPage');
            const pageInfo = document.getElementById('pageInfo');

            if (allRows.length === 0) {
                paginationContainer.style.display = 'none';
                return;
            }

            const totalPages = Math.ceil(allRows.length / rowsPerPage);
            currentPage = Math.max(1, Math.min(page, totalPages));

            const startIdx = (currentPage - 1) * rowsPerPage;
            const endIdx = startIdx + rowsPerPage;
            const pageRows = allRows.slice(startIdx, endIdx);

            const table = `
                <table>
                    <thead>
                        <tr>${allColumns.map(col => `<th>${col}</th>`).join('')}</tr>
                    </thead>
                    <tbody>
                        ${pageRows.map(row => `
                            <tr>${allColumns.map(col => `<td>${formatValue(row[col])}</td>`).join('')}</tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            tableContainer.innerHTML = table;

            // Update pagination controls
            if (allRows.length > rowsPerPage) {
                paginationContainer.style.display = 'block';
                pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${allRows.length} total rows)`;
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
                prevBtn.style.opacity = currentPage === 1 ? '0.5' : '1';
                nextBtn.style.opacity = currentPage === totalPages ? '0.5' : '1';
                prevBtn.style.cursor = currentPage === 1 ? 'not-allowed' : 'pointer';
                nextBtn.style.cursor = currentPage === totalPages ? 'not-allowed' : 'pointer';
            } else {
                paginationContainer.style.display = 'none';
            }
        }

        function changePage(delta) {
            renderTable(currentPage + delta);
        }

        function toggleEditSql() {
            const sqlDisplay = document.getElementById('sqlDisplay');
            const sqlEditor = document.getElementById('sqlEditor');
            const editBtn = document.getElementById('editSqlBtn');
            const executeBtn = document.getElementById('executeSqlBtn');
            const cancelBtn = document.getElementById('cancelEditBtn');

            // Switch to edit mode
            sqlEditor.value = sqlDisplay.textContent;
            sqlDisplay.style.display = 'none';
            sqlEditor.style.display = 'block';
            editBtn.style.display = 'none';
            executeBtn.style.display = 'inline-block';
            cancelBtn.style.display = 'inline-block';
        }

        function cancelEditSql() {
            const sqlDisplay = document.getElementById('sqlDisplay');
            const sqlEditor = document.getElementById('sqlEditor');
            const editBtn = document.getElementById('editSqlBtn');
            const executeBtn = document.getElementById('executeSqlBtn');
            const cancelBtn = document.getElementById('cancelEditBtn');

            // Switch back to display mode
            sqlDisplay.style.display = 'block';
            sqlEditor.style.display = 'none';
            editBtn.style.display = 'inline-block';
            executeBtn.style.display = 'none';
            cancelBtn.style.display = 'none';
        }

        async function executeEditedSql() {
            const sqlEditor = document.getElementById('sqlEditor');
            const errorDiv = document.getElementById('errorDiv');
            const tableContainer = document.getElementById('tableContainer');
            const statsDiv = document.getElementById('statsDiv');
            const executeBtn = document.getElementById('executeSqlBtn');

            const editedSql = sqlEditor.value.trim();

            if (!editedSql) {
                errorDiv.textContent = 'Please enter a SQL query';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            executeBtn.disabled = true;
            executeBtn.textContent = '⏳ Executing...';

            try {
                const response = await fetch('/api/sql', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sql: editedSql
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Update the display with edited SQL
                    document.getElementById('sqlDisplay').textContent = editedSql;

                    // Cancel edit mode
                    cancelEditSql();

                    // Store data for pagination and render
                    if (data.rows && data.rows.length > 0) {
                        allRows = data.rows;
                        allColumns = data.columns;
                        currentPage = 1;
                        renderTable(1);

                        // Display stats
                        const truncatedMsg = data.truncated ? ' (truncated)' : '';
                        statsDiv.innerHTML = `
                            <span>Rows: ${data.row_count}${truncatedMsg}</span>
                            <span>Execution time: ${data.execution_time_ms}ms</span>
                            <span>Model: Custom SQL</span>
                        `;
                    } else {
                        allRows = [];
                        allColumns = [];
                        document.getElementById('paginationContainer').style.display = 'none';
                        tableContainer.innerHTML = `
                            <div style="text-align: center; padding: 40px; background: #f8f9fa; border-radius: 8px; margin-top: 20px;">
                                <div style="font-size: 48px; margin-bottom: 15px;">📊</div>
                                <div style="font-size: 18px; font-weight: 600; color: #333; margin-bottom: 8px;">No Records Found</div>
                                <div style="color: #666;">The query executed successfully but returned no results.</div>
                            </div>
                        `;
                        statsDiv.innerHTML = `
                            <span>Rows: 0</span>
                            <span>Execution time: ${data.execution_time_ms}ms</span>
                            <span>Model: Custom SQL</span>
                        `;
                    }
                } else {
                    errorDiv.textContent = `Error: ${data.error}`;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = `Network error: ${error.message}`;
                errorDiv.style.display = 'block';
            } finally {
                executeBtn.disabled = false;
                executeBtn.textContent = '▶ Execute Edited';
            }
        }

        function copySql() {
            const sql = document.getElementById('sqlDisplay').textContent;
            navigator.clipboard.writeText(sql).then(() => {
                const btn = event.target;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = 'Copy SQL';
                }, 2000);
            });
        }

        function handleSpellCheckSuggestion(data) {
            const errorDiv = document.getElementById('errorDiv');
            const sqlDisplay = document.getElementById('sqlDisplay');

            // Show suggestion with buttons
            const correctedQuery = data.spell_check.corrected_query;

            errorDiv.innerHTML = `
                <div style="margin-bottom: 15px;">
                    <strong>⚠️ Possible spelling errors detected</strong><br>
                    ${data.error}
                </div>
                <div style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <div style="margin-bottom: 10px;">
                        <strong>Original:</strong><br>
                        <span style="color: #c33;">${data.natural_language_query}</span>
                    </div>
                    <div>
                        <strong>Did you mean:</strong><br>
                        <span style="color: #0a0; font-weight: bold;">${correctedQuery}</span>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="useCorrectedQuery('${correctedQuery.replace(/'/g, "\\'")}')"
                            style="padding: 10px 20px; background: #0a0; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
                        ✓ Use Corrected Version
                    </button>
                    <button onclick="executeWithOriginal()"
                            style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">
                        Use Original Anyway
                    </button>
                </div>
            `;
            errorDiv.style.display = 'block';
            sqlDisplay.innerHTML = '';
        }

        function useCorrectedQuery(correctedQuery) {
            document.getElementById('questionInput').value = correctedQuery;
            skipSpellCheck = true;
            executeQuery(true);
        }

        function executeWithOriginal() {
            executeQuery(true);
        }

        function handleAmbiguityClarification(data) {
            const errorDiv = document.getElementById('errorDiv');
            const sqlDisplay = document.getElementById('sqlDisplay');

            const ambiguity = data.ambiguity;
            const options = ambiguity.clarification_options || [];

            // Build option buttons
            let optionsHtml = '';
            options.forEach((option, index) => {
                optionsHtml += `
                    <button onclick="selectClarification('${option.refined_query.replace(/'/g, "\\'")}')"
                            style="display: block; width: 100%; padding: 12px; margin-bottom: 10px; background: white;
                                   border: 2px solid #667eea; border-radius: 8px; cursor: pointer; text-align: left;
                                   transition: all 0.2s;"
                            onmouseover="this.style.background='#f0f0ff'"
                            onmouseout="this.style.background='white'">
                        <strong>${option.text}</strong>
                    </button>
                `;
            });

            errorDiv.innerHTML = `
                <div style="margin-bottom: 15px;">
                    <strong>🤔 Your query needs clarification</strong><br>
                    ${ambiguity.reason}
                </div>
                <div style="background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <strong>What did you mean?</strong><br><br>
                    ${optionsHtml}
                    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
                        <input type="text" id="customClarification" placeholder="Or type your own clarification..."
                               style="width: 100%; padding: 10px; border: 2px solid #e1e4e8; border-radius: 6px; margin-bottom: 10px;">
                        <button onclick="selectCustomClarification()"
                                style="padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer;">
                            Use Custom Query
                        </button>
                    </div>
                </div>
            `;
            errorDiv.style.display = 'block';
            sqlDisplay.innerHTML = '';
        }

        function selectClarification(refinedQuery) {
            document.getElementById('questionInput').value = refinedQuery;
            skipSpellCheck = true;
            executeQueryWithSkips(true, true);
        }

        function selectCustomClarification() {
            const customQuery = document.getElementById('customClarification').value.trim();
            if (!customQuery) {
                alert('Please enter a query');
                return;
            }
            document.getElementById('questionInput').value = customQuery;
            skipSpellCheck = true;
            executeQueryWithSkips(true, true);
        }

        function executeQueryWithSkips(skipSpell, skipAmbiguity) {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) return;

            const executeBtn = document.getElementById('executeBtn');
            const resultsSection = document.getElementById('resultsSection');
            const errorDiv = document.getElementById('errorDiv');
            const sqlDisplay = document.getElementById('sqlDisplay');
            const tableContainer = document.getElementById('tableContainer');

            executeBtn.disabled = true;
            executeBtn.textContent = 'Executing...';
            resultsSection.classList.add('show');
            errorDiv.style.display = 'none';
            sqlDisplay.innerHTML = '<div class="loading"><div class="spinner"></div><p>Generating SQL...</p></div>';
            tableContainer.innerHTML = '';

            const model = document.getElementById('modelSelect').value;
            fetch(`${API_BASE}/api/query`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: question,
                    include_explanation: true,
                    model: model,
                    skip_spell_check: skipSpell,
                    skip_ambiguity_check: skipAmbiguity
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('sqlDisplay').textContent = data.sql;
                    if (data.explanation) {
                        document.getElementById('explanationText').textContent = data.explanation;
                        document.getElementById('explanationDiv').style.display = 'block';
                    }
                    if (data.rows && data.rows.length > 0) {
                        const table = `
                            <table>
                                <thead>
                                    <tr>${data.columns.map(col => `<th>${col}</th>`).join('')}</tr>
                                </thead>
                                <tbody>
                                    ${data.rows.map(row => `
                                        <tr>${data.columns.map(col => `<td>${formatValue(row[col])}</td>`).join('')}</tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `;
                        document.getElementById('tableContainer').innerHTML = table;
                        const truncatedMsg = data.truncated ? ' (truncated)' : '';
                        document.getElementById('statsDiv').innerHTML = `
                            <span>Rows: ${data.row_count}${truncatedMsg}</span>
                            <span>Execution time: ${data.execution_time_ms}ms</span>
                            <span>Model: ${data.model}</span>
                        `;
                    } else {
                        document.getElementById('tableContainer').innerHTML = `
                            <div style="text-align: center; padding: 40px; background: #f8f9fa; border-radius: 8px; margin-top: 20px;">
                                <div style="font-size: 48px; margin-bottom: 15px;">📊</div>
                                <div style="font-size: 18px; font-weight: 600; color: #333; margin-bottom: 8px;">No Records Found</div>
                                <div style="color: #666;">The query executed successfully but returned no results.</div>
                            </div>
                        `;
                        document.getElementById('statsDiv').innerHTML = `
                            <span>Rows: 0</span>
                            <span>Execution time: ${data.execution_time_ms}ms</span>
                            <span>Model: ${data.model}</span>
                        `;
                    }
                } else {
                    errorDiv.textContent = `Error: ${data.error}`;
                    errorDiv.style.display = 'block';
                }
            })
            .catch(error => {
                errorDiv.textContent = `Network error: ${error.message}`;
                errorDiv.style.display = 'block';
            })
            .finally(() => {
                executeBtn.disabled = false;
                executeBtn.textContent = 'Execute';
            });
        }

        // ============================================================================
        // CONVERSATION MODE
        // ============================================================================

        let conversationModeEnabled = false;
        let currentSessionId = null;

        function toggleConversationMode() {
            conversationModeEnabled = document.getElementById('conversationMode').checked;
            const clearBtn = document.getElementById('clearConversationBtn');
            const chatHistory = document.getElementById('chatHistory');

            if (conversationModeEnabled) {
                // Generate new session ID
                currentSessionId = `session_${Date.now()}`;
                clearBtn.style.display = 'inline-block';
                console.log('✅ Conversation mode ENABLED, session:', currentSessionId);

                // Add visual indicator
                const indicator = document.createElement('div');
                indicator.id = 'convoModeIndicator';
                indicator.style.cssText = 'text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px; border-radius: 8px; margin: 10px; font-weight: 600;';
                indicator.innerHTML = '🤖 Conversation Mode Active - You\'ll get intelligent insights and suggestions!';
                chatHistory.appendChild(indicator);
                chatHistory.scrollTop = chatHistory.scrollHeight;
            } else {
                clearBtn.style.display = 'none';
                const indicator = document.getElementById('convoModeIndicator');
                if (indicator) indicator.remove();
                console.log('❌ Conversation mode DISABLED');
            }
        }

        function displayConversationInsights(conversation) {
            if (!conversationModeEnabled || !conversation) return;

            const insightsPanel = document.getElementById('conversationInsights');
            const insightsText = document.getElementById('insightsText');
            const suggestionsDiv = document.getElementById('followupSuggestions');
            const suggestionsList = document.getElementById('suggestionsList');
            const nudgeDiv = document.getElementById('nudgeText');

            // Show insights
            if (conversation.insights) {
                insightsText.textContent = conversation.insights;
                insightsPanel.style.display = 'block';
            }

            // Show suggestions as clickable chips
            if (conversation.suggestions && conversation.suggestions.length > 0) {
                suggestionsList.innerHTML = conversation.suggestions.map((suggestion, idx) => `
                    <div onclick="executeSuggestion('${suggestion.question.replace(/'/g, "\\'")}')"
                         style="padding: 12px 16px; margin-bottom: 10px; background: white; border: 2px solid #667eea;
                                border-radius: 8px; cursor: pointer; transition: all 0.2s;"
                         onmouseover="this.style.background='#f0f0ff'; this.style.transform='translateX(5px)';"
                         onmouseout="this.style.background='white'; this.style.transform='translateX(0)';">
                        <div style="font-weight: 600; color: #667eea; margin-bottom: 5px;">
                            ${idx + 1}. ${suggestion.question}
                        </div>
                        <div style="font-size: 0.9em; color: #666;">
                            ${suggestion.reasoning}
                        </div>
                    </div>
                `).join('');
                suggestionsDiv.style.display = 'block';
            } else {
                suggestionsDiv.style.display = 'none';
            }

            // Show nudge
            if (conversation.nudge) {
                nudgeDiv.textContent = '💭 ' + conversation.nudge;
                nudgeDiv.style.display = 'block';
            } else {
                nudgeDiv.style.display = 'none';
            }
        }

        function executeSuggestion(question) {
            document.getElementById('questionInput').value = question;
            skipSpellCheck = true;
            executeQuery(true);
        }

        function executeCustomClarification(inputId) {
            const customInput = document.getElementById(inputId);
            const customQuery = customInput?.value.trim();
            if (!customQuery) {
                alert('Please enter a clarification');
                return;
            }
            executeSuggestion(customQuery);
        }

        async function clearConversation() {
            if (!currentSessionId) return;

            if (!confirm('Clear conversation history? This will reset the context.')) {
                return;
            }

            try {
                const response = await fetch(`/api/conversation/${currentSessionId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    // Clear chat history
                    const chatHistory = document.getElementById('chatHistory');
                    chatHistory.innerHTML = `
                        <div style="text-align: center; color: #999; padding: 40px 20px;">
                            <div style="font-size: 48px; margin-bottom: 10px;">💬</div>
                            <div style="font-size: 1.1em; font-weight: 600; margin-bottom: 8px;">Start a Conversation</div>
                            <div style="font-size: 0.9em;">Ask a question about healthcare data or enable conversation mode for intelligent insights</div>
                        </div>
                    `;

                    // Generate new session
                    currentSessionId = `session_${Date.now()}`;
                    console.log('Conversation cleared, new session:', currentSessionId);

                    // Show confirmation message
                    const messageDiv = document.createElement('div');
                    messageDiv.style.cssText = 'text-align: center; color: #28a745; font-weight: 600; padding: 20px;';
                    messageDiv.textContent = '✓ Conversation history cleared. Starting fresh!';
                    chatHistory.appendChild(messageDiv);

                    setTimeout(() => {
                        messageDiv.remove();
                    }, 3000);
                } else {
                    alert('Failed to clear conversation');
                }
            } catch (error) {
                console.error('Clear conversation error:', error);
                alert('Error clearing conversation: ' + error.message);
            }
        }

        // Load examples on page load
        loadExamples();
    </script>
</body>
</html>
